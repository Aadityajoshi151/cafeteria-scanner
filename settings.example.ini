; cafeteria scanner settings
[email]
; username = full Gmail address,
; password = the 16-character App Password (NOT the normal Gmail password).
smtp_server = smtp.gmail.com
smtp_port = 587
username = yourname@gmail.com
password = xxxx xxxx xxxx xxxx

; Who receives the daily file. Separate several addresses with commas.
to = person@example.com
cc =

; Optional. Leave empty to send from the username address.
sender =

; {date} is replaced with the day's date, e.g. 17 Oct 2026
subject = cafeteria lunch - {date}